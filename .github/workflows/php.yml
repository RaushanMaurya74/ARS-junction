name: PHP Syntax Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none

    - name: Lint PHP Files
      run: |
        errors=0
        while IFS= read -r -d '' file; do
          if ! php -l "$file"; then
            errors=$((errors+1))
          fi
        done < <(find . -type f -name "*.php" ! -path "*/vendor/*" -print0)
        if [ $errors -ne 0 ]; then
          echo "$errors PHP file(s) failed syntax check."
          exit 1
        fi
